name: Security Code Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin tree-sitter to 0.21.3 to avoid breaking API changes (no build_library in 0.22+)
        pip install "tree-sitter==0.21.3"
        # Install language parsers
        pip install tree-sitter-python tree-sitter-javascript tree-sitter-java
        # Install other requirements
        pip install streamlit plotly pandas rich typer

    - name: Create Test Data
      run: |
        # Create a dummy python file to ensure we have something to scan
        mkdir -p examples/vulnerable_code
        echo 'import os; os.system("ls")' > examples/vulnerable_code/test.py

    - name: Debug CLI
      run: |
        # Print help to logs to verify arguments
        python main.py --help || echo "Help command failed"

    - name: Run Security Scan
      # We allow this step to fail so the workflow continues to the "Ensure Report" step
      continue-on-error: true
      run: |
        # Try running the scan. If your script uses 'scan' subcommand, update it here.
        python main.py examples/vulnerable_code/ --output scan_results.json --severity low

    - name: Ensure Report Exists
      if: always() # Run this even if the scan step crashed
      run: |
        # If the scan failed to create the file, create a dummy one
        if [ ! -f scan_results.json ]; then
          echo '{"summary": {"error": "Scan failed to run or crashed"}, "vulnerabilities": []}' > scan_results.json
        fi
        
        # Ensure HTML report exists too
        if [ ! -f scan_results.html ]; then
          echo '<html><body><h1>Scan Failed</h1><p>Check GitHub Actions logs for the python traceback.</p></body></html>' > scan_results.html
        fi

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-report
        path: |
          scan_results.json
          scan_results.html
