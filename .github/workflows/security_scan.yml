name: Security Code Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinning tree-sitter to 0.21.3 to avoid breaking API changes
        pip install "tree-sitter==0.21.3"
        pip install tree-sitter-python tree-sitter-javascript tree-sitter-java
        pip install scikit-learn
        pip install streamlit plotly pandas rich typer

    - name: Create Test Data
      run: |
        mkdir -p examples/vulnerable_code
        echo 'import os; os.system("ls")' > examples/vulnerable_code/test.py

    - name: Run Security Scan (With Error Capture)
      id: scan
      continue-on-error: true
      run: |
        # We redirect BOTH standard output (1) and error (2) to error_log.txt
        # This ensures the error is saved to a file you can download
        python main.py examples/vulnerable_code/ --output scan_results.json --severity low > error_log.txt 2>&1 || echo "Scan crashed"

    - name: Generate Failure Report
      if: always()
      run: |
        if [ ! -f scan_results.json ]; then
          echo '{"summary": {"error": "Scan Failed"}, "vulnerabilities": []}' > scan_results.json
          
          # Embed the error log into the HTML so you can read it easily
          echo '<html><body><h1>Scan Failed</h1><h2>Error Log:</h2><pre>' > scan_results.html
          cat error_log.txt >> scan_results.html
          echo '</pre></body></html>' >> scan_results.html
        fi

    - name: Upload Logs & Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-report
        path: |
          scan_results.json
          scan_results.html
          error_log.txt
